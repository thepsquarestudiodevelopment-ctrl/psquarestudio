<!DOCTYPE html>
<html class="no-js" lang="zxx">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>PSquare Studio - Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="shortcut icon" href="assets/img/logo/Asset1.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/magnific-popup.css" />
    <link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/portfolio.css" />
    <link rel="stylesheet" href="assets/css/header.css" />

    <!-- REQUIRED POPUP STYLES -->
    <style>
      .portfolio-popup {
        display: block;
        width: 100%;
        height: 100%;
        text-decoration: none;
        cursor: zoom-in;
      }

      .mfp-bg {
        background: rgba(0, 0, 0, 0.92);
      }

      .mfp-figure img {
        max-height: 90vh;
        width: auto;
      }

      .mfp-iframe-holder .mfp-content {
        max-width: 90%;
        height: 80vh;
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header class="header-area">
      <div class="header-container">
        <div class="logo">
          <a href="index.html">
            <img src="assets/img/logo/Asset1.png" alt="Logo" />
          </a>
        </div>
      </div>
    </header>

    <!-- PORTFOLIO -->
    <main class="portfolio-page">
      <div class="container-fluid px-30">
        <div class="grid row" id="portfolioGrid">

          <!-- IMAGE ITEM -->
          <div class="col-lg-4 col-md-6 grid-item prof mb-30">
            <div class="td-portfolio-filter-wrapper">
              <a
                href="assets/img/portfolio/Graphic Design/1.jpg"
                class="portfolio-popup"
                data-type="image"
              >
                <div class="td-portfolio-filter-thumb">
                  <img
                    data-src="assets/img/portfolio/Graphic Design/1.jpg"
                    class="lazy"
                    alt="Graphic Design"
                  />
                </div>
              </a>
            </div>
          </div>

          <!-- VIDEO ITEM -->
          <div class="col-lg-4 col-md-6 grid-item prof1 mb-30">
            <div class="td-portfolio-filter-wrapper">
              <a
                href="assets/img/portfolio/Motion graphics/1.mp4"
                class="portfolio-popup"
                data-type="video"
              >
                <div class="td-portfolio-filter-thumb">
                  <video
                    class="lazy-video"
                    muted
                    loop
                    playsinline
                    preload="metadata"
                    data-src="assets/img/portfolio/Motion graphics/1.mp4"
                    data-thumb="assets/img/portfolio/Motion graphics/thumbnail_1.jpg"
                  ></video>
                </div>
              </a>
            </div>
          </div>

          <!-- ADD ALL OTHER ITEMS USING SAME PATTERN -->

        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4">
      <p>© 2025 PSQUARE. All Rights Reserved.</p>
    </footer>

    <!-- JS -->
    <script src="assets/js/vendor/jquery.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/isotope.pkgd.min.js"></script>
    <script src="assets/js/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>

    <!-- LAZY LOAD -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const lazyImages = document.querySelectorAll("img.lazy");
        const lazyVideos = document.querySelectorAll("video.lazy-video");

        const observer = new IntersectionObserver(
          (entries, obs) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const el = entry.target;
                if (el.dataset.src) el.src = el.dataset.src;
                el.classList.remove("lazy", "lazy-video");
                obs.unobserve(el);
              }
            });
          },
          { rootMargin: "200px" }
        );

        lazyImages.forEach((img) => observer.observe(img));
        lazyVideos.forEach((vid) => observer.observe(vid));
      });
    </script>

    <!-- MAGNIFIC POPUP INIT -->
    <script>
      $(document).ready(function () {
        $(".portfolio-popup").magnificPopup({
          type: "image",
          gallery: {
            enabled: true,
          },
          callbacks: {
            elementParse: function (item) {
              const type = item.el.attr("data-type");
              if (type === "video") {
                item.type = "iframe";
                item.src =
                  item.el.attr("href") +
                  "?autoplay=1&controls=1";
              } else {
                item.type = "image";
                item.src = item.el.attr("href");
              }
            },
          },
          closeBtnInside: true,
          removalDelay: 300,
          mainClass: "mfp-fade",
        });
      });
    </script>
  </body>
</html>
